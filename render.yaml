# Blueprint для бесплатного хостинга Render: https://render.com  (New → Blueprint)
services:
  - type: web
    name: ai-assistant-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false   # ключ вводится вручную в панели Render
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://yuwnxu.github.io
